name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish releases, and the build log on failure

jobs:
  tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libcurl4-openssl-dev ninja-build
      - name: Build and run the tests
        shell: bash
        run: |
          mkdir -p logs
          { cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build && ./build/comptests; } 2>&1 | tee logs/tests.log
          exit ${PIPESTATUS[0]}
      - name: Share the log
        if: failure()
        uses: ./.github/actions/share-log
        with:
          name: tests
          token: ${{ secrets.GITHUB_TOKEN }}

  switch:
    name: Switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Portlibs
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dkp-pacman -Sy --noconfirm --needed switch-portlibs || true
      - name: Build
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          mkdir -p logs
          { cmake -S . -B build-switch -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release \
              && cmake --build build-switch --target Compendium.nro -j"$(nproc)"; } 2>&1 | tee logs/switch.log
          exit ${PIPESTATUS[0]}
      - name: Share the log
        if: failure()
        uses: ./.github/actions/share-log
        with:
          name: switch
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Compendium
          path: build-switch/Compendium.nro
      # A new version is released by the first push to main that has its VERSION and its notes
      # (docs/releases/v<version>.md); the tag is made here. Later pushes leave it as it is.
      - name: New version?
        id: version
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(head -n1 VERSION | tr -d '[:space:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          create=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ -f "docs/releases/$tag.md" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            [ "$code" = 404 ] && create=true
          fi
          echo "create=$create" >> "$GITHUB_OUTPUT"
          echo "$tag: release needed = $create"
      - name: Release
        if: steps.version.outputs.create == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Compendium ${{ steps.version.outputs.tag }}
          files: build-switch/Compendium.nro
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          prerelease: ${{ startsWith(steps.version.outputs.tag, 'v0.0.') }}
