name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish releases, and the build log on failure

jobs:
  tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libcurl4-openssl-dev ninja-build
      # These ask the filesystem for canonical paths, which the Switch's SD card driver refuses
      # (0.0.1 couldn't install mods because of fs::relative). Use mm::relativeTo and friends instead.
      - name: No filesystem calls the Switch can't do
        shell: bash
        run: |
          if grep -rnE 'fs::(relative|proximate|canonical|weakly_canonical|equivalent)\(' source; then
            echo "::error::These std::filesystem calls fail on the Switch's SD card; use mm::relativeTo"
            exit 1
          fi
      - name: Build and run the tests
        shell: bash
        run: |
          mkdir -p logs
          { cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build && ./build/comptests; } 2>&1 | tee logs/tests.log
          exit ${PIPESTATUS[0]}
      - name: Share the log
        if: failure()
        uses: ./.github/actions/share-log
        with:
          name: tests
          token: ${{ secrets.GITHUB_TOKEN }}

  switch:
    name: Switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Portlibs
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dkp-pacman -Sy --noconfirm --needed switch-portlibs || true
      - name: Build
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          mkdir -p logs
          { cmake -S . -B build-switch -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release \
              && cmake --build build-switch --target Compendium.nro -j"$(nproc)"; } 2>&1 | tee logs/switch.log
          exit ${PIPESTATUS[0]}
      - name: Share the log
        if: failure()
        uses: ./.github/actions/share-log
        with:
          name: switch
          token: ${{ secrets.GITHUB_TOKEN }}
      # The zip players download: switch/Compendium/ with the .nro, README.txt, LICENSES.txt and inbox/.
      - name: Package
        shell: bash
        run: bash tools/make_release.sh "$(head -n1 VERSION | tr -d '[:space:]')" build-switch/Compendium.nro dist
      - name: Keep the switch folder (download it, copy switch/ to the SD card)
        uses: actions/upload-artifact@v4
        with:
          name: Compendium
          path: dist/stage/
      - name: Keep the zip for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/Compendium-*.zip
          retention-days: 7

  # A new version is released by the first push to main that has its VERSION and its notes
  # (docs/releases/v<version>.md); the tag is made here. Later pushes keep the release's file and
  # bring its text in line with the notes. See tools/publish_release.sh.
  release:
    name: Release
    needs: [tests, switch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist
      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish_release.sh
