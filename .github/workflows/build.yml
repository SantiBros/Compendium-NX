name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libcurl4-openssl-dev ninja-build
      - name: Build and run the tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/pmmtests

  switch:
    name: Switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Portlibs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dkp-pacman -Sy --noconfirm --needed switch-portlibs
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          cmake -S . -B build-switch -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-switch --target PersonaModManager.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: PersonaModManager
          path: build-switch/PersonaModManager.nro
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-switch/PersonaModManager.nro
          draft: true
